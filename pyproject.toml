[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-assistant"
version = "0.1.0"
description = "Grounded enterprise document question-answering with validated citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.117,<1",
  "langchain>=1.0,<2",
  "langchain-community>=0.4,<1",
  "langchain-groq>=1.0,<2",
  "langchain-huggingface>=1.0,<2",
  "langchain-qdrant>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.2,<2",
  "qdrant-client>=1.15,<2",
  "sentence-transformers>=5,<6",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.49,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "domain", "ingestion", "rag", "storage", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["tests"]
